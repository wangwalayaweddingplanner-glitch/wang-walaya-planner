function genId(){return Math.random().toString(36).substr(2,8).toUpperCase();}
function fmtDate(iso){if(!iso)return"";const d=new Date(iso);return d.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"});}
function daysDiff(iso){if(!iso)return null;const n=new Date();n.setHours(0,0,0,0);const d=new Date(iso);d.setHours(0,0,0,0);return Math.round((d-n)/86400000);}
function dueBadge(diff){if(diff===null)return null;if(diff<0)return{t:`เลยกำหนด ${Math.abs(diff)} วัน`,c:"#e05252"};if(diff===0)return{t:"ครบกำหนดวันนี้!",c:"#e07a52"};if(diff<=7)return{t:`อีก ${diff} วัน`,c:"#d4a62a"};return{t:`อีก ${diff} วัน`,c:"#7B9E87"};}
function gcalUrl(title,dateIso){
  if(!dateIso)return null;
  const d=new Date(dateIso);
  const pad=n=>String(n).padStart(2,"0");
  const ymd=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  const start=ymd+"T090000";const end=ymd+"T100000";
  const t=encodeURIComponent(title);
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${t}&dates=${start}/${end}&details=Wang+Walaya+Wedding+Planner`;
}
function countdown(ds){if(!ds)return null;const n=new Date();n.setHours(0,0,0,0);const w=new Date(ds);w.setHours(0,0,0,0);const d=Math.round((w-n)/86400000);if(d<0)return`งานผ่านไปแล้ว ${Math.abs(d)} วัน 🎉`;if(d===0)return"วันนี้คือวันแต่งงาน! 💍";return`อีก ${d} วัน`;}

function Spinner(){return <div style={{textAlign:"center",padding:60}}><div className="spinner"/><p style={{color:"#9a8070",marginTop:16,fontSize:14}}>กำลังโหลด...</p></div>;}

function App(){
  const[screen,setScreen]=useState("home"); // home | create | join | main | dashboard
  const[allWeddings,setAllWeddings]=useState([]);
  const[dashPin,setDashPin]=useState("");
  const[dashErr,setDashErr]=useState("");
  const[dashAuth,setDashAuth]=useState(false);
  const[weddingId,setWeddingId]=useState("");
  const[joinId,setJoinId]=useState("");
  const[joinPin,setJoinPin]=useState("");
  const[joinErr,setJoinErr]=useState("");
  const[role,setRole]=useState(null);
  const[wData,setWData]=useState(null);
  const[syncing,setSyncing]=useState(false);
  const[online,setOnline]=useState(true);

  // Listen for firebase config missing
  const[configOk]=useState(()=>window.FIREBASE_CONFIG?.apiKey!=="PASTE_YOUR_apiKey_HERE" && typeof firebase!=="undefined");

  useEffect(()=>{
    const off1=()=>setOnline(false); const on1=()=>setOnline(true);
    window.addEventListener("offline",off1); window.addEventListener("online",on1);
    return()=>{window.removeEventListener("offline",off1);window.removeEventListener("online",on1);};
  },[]);

  // Realtime listener
  useEffect(()=>{
    if(!weddingId||screen!=="main")return;
    const ref=db.ref("weddings/"+weddingId);
    const handler=ref.on("value",snap=>{
      const val=snap.val();
      if(val) setWData(val);
    });
    return()=>ref.off("value",handler);
  },[weddingId,screen]);

  function writeDb(path,value){
    setSyncing(true);
    db.ref("weddings/"+weddingId+"/"+path).set(value)
      .finally(()=>setTimeout(()=>setSyncing(false),600));
  }

  async function loadAllWeddings(){
    try{
      const snap=await db.ref("weddings").get();
      const data=snap.val();
      if(!data){setAllWeddings([]);return;}
      const list=Object.values(data).filter(v=>v&&typeof v==="object").sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      setAllWeddings(list);
    }catch(e){
      // fallback: try once()
      db.ref("weddings").once("value").then(snap=>{
        const data=snap.val();
        if(!data){setAllWeddings([]);return;}
        const list=Object.values(data).filter(v=>v&&typeof v==="object").sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
        setAllWeddings(list);
      }).catch(()=>setAllWeddings([]));
    }
  }

  async function createWedding(coupleName,wedDate,plannerPin,guestPin){
    const id=genId();
    const data={
      id, coupleName, weddingDate:wedDate,
      plannerPin, guestPin,
      categories:DEFAULT_CATEGORIES,
      createdAt:Date.now()
    };
    await db.ref("weddings/"+id).set(data);
    setWeddingId(id); setWData(data); setRole("planner"); setScreen("main");
    return id;
  }

  async function joinWedding(){
    setJoinErr("");
    try{
      const snap=await db.ref("weddings/"+joinId.trim().toUpperCase()).get();
      if(!snap.exists())return setJoinErr("ไม่พบ Wedding ID นี้");
      const data=snap.val();
      if(joinPin===data.plannerPin){setRole("planner");}
      else if(joinPin===data.guestPin){setRole("guest");}
      else return setJoinErr("PIN ไม่ถูกต้อง");
      setWeddingId(joinId.trim().toUpperCase()); setWData(data); setScreen("main");
    }catch(e){setJoinErr("เกิดข้อผิดพลาด กรุณาลองใหม่");}
  }

  if(!configOk) return <ConfigWarning/>;
  if(screen==="dashboard") return <DashboardScreen weddings={allWeddings} onLoad={loadAllWeddings} onBack={()=>{setScreen("home");setDashAuth(false);setDashPin("");}} onOpen={(w)=>{setWeddingId(w.id);setWData(w);setRole("planner");setScreen("main");}} dashPin={dashPin} setDashPin={setDashPin} dashErr={dashErr} setDashErr={setDashErr} dashAuth={dashAuth} setDashAuth={setDashAuth}/>;
  if(screen==="home") return <HomeScreen onCreate={()=>setScreen("create")} onJoin={()=>setScreen("join")} onDash={()=>setScreen("dashboard")}/>;
  if(screen==="create") return <CreateScreen onCreate={createWedding} onBack={()=>setScreen("home")}/>;
  if(screen==="join") return <JoinScreen joinId={joinId} setJoinId={setJoinId} joinPin={joinPin} setJoinPin={setJoinPin} joinErr={joinErr} onJoin={joinWedding} onBack={()=>setScreen("home")}/>;
  if(screen==="main"&&wData) return <MainApp wData={wData} role={role} weddingId={weddingId} writeDb={writeDb} syncing={syncing} online={online} onExit={()=>{setScreen("home");setRole(null);setWData(null);setWeddingId("");}}/>;
  return <Spinner/>;
}

function ConfigWarning(){
  return(
    <div style={{minHeight:"100vh",background:"#fdf8f3",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{maxWidth:380,background:"#fff",borderRadius:20,padding:28,boxShadow:"0 4px 20px rgba(74,55,40,.1)"}}>
        <p style={{fontSize:32,textAlign:"center",marginBottom:12}}>⚙️</p>
        <h2 style={{fontSize:18,color:"#4a3728",fontWeight:700,marginBottom:12,textAlign:"center"}}>ต้องตั้งค่า Firebase ก่อน</h2>
        <p style={{fontSize:14,color:"#7a6555",lineHeight:1.7,marginBottom:16}}>
          กรุณาเปิดไฟล์ HTML ด้วย Text Editor แล้วแทนที่ค่า <code style={{background:"#f0e8df",padding:"1px 6px",borderRadius:4,fontSize:12}}>PASTE_YOUR_..._HERE</code> ด้วยข้อมูลจาก Firebase Console
        </p>
        <div style={{background:"#fdf8f3",borderRadius:10,padding:14,fontSize:12,color:"#6b4c38",lineHeight:2}}>
          <b>วิธีทำ:</b><br/>
          1. ไปที่ <b>console.firebase.google.com</b><br/>
          2. สร้าง Project ใหม่<br/>
          3. เพิ่ม Web App → คัดลอก Config<br/>
          4. เปิด Realtime Database → สร้าง DB<br/>
          5. ตั้ง Rules เป็น <code style={{background:"#f0e8df",padding:"1px 4px",borderRadius:3}}>true</code><br/>

  const[pPin2,setPPin2]=useState("");
  const[gPin,setGPin]=useState("");

  async function handleCreate(){
    if(!name.trim())return setErr("กรุณาใส่ชื่อคู่บ่าวสาว");

  if(createdId) return(

        <div style={{background:"#4a3728",borderRadius:16,padding:20,marginBottom:16}}>

        </div>

          <p style={{fontSize:12,color:"#9a8070",marginBottom:4}}>📋 วิธีแชร์ให้บ่าวสาว</p>
          <p style={{fontSize:13,color:"#4a3728",lineHeight:1.8}}>

        <p style={{fontSize:13,color:"#9a8070",marginBottom:16}}>กำลังเข้าสู่ระบบอัตโนมัติ...</p>
      </div>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:"#fdf8f3",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{width:"100%",maxWidth:340}}>
        <button onClick={onBack} style={S.backBtn}>← กลับ</button>
        <p style={{fontSize:40,textAlign:"center",marginBottom:8}}>💍</p>
        <h2 style={{fontSize:20,color:"#4a3728",fontWeight:700,textAlign:"center",marginBottom:4}}>สร้างงานแต่งงานใหม่</h2>
        <p style={{fontSize:13,color:"#9a8070",textAlign:"center",marginBottom:20}}>ข้อมูลจะ sync realtime ทุก device</p>
        {[
          ["ชื่อคู่บ่าวสาว เช่น น้ำ & นนท์",name,setName,"text"],
          ["วันแต่งงาน",date,setDate,"date"],
          ["PIN สำหรับ Planner (4+ ตัว)",pPin,setPPin,"password"],
          ["ยืนยัน PIN Planner",pPin2,setPPin2,"password"],

function MainApp({wData,role,weddingId,writeDb,syncing,online,onExit}){
  const isP=role==="planner";
  const cats=wData.categories||[];
  const[tab,setTab]=useState("all");
  const[addTo,setAddTo]=useState(null);
  const[newTxt,setNewTxt]=useState("");const[newDue,setNewDue]=useState("");
  const[editItem,setEditItem]=useState(null);const[eTxt,setETxt]=useState("");const[eDue,setEDue]=useState("");const[eVendor,setEVendor]=useState("");
  const[editCat,setEditCat]=useState(null);const[eCatT,setECatT]=useState("");
  const[showSet,setShowSet]=useState(false);
  const[sWDate,setSWDate]=useState(wData.weddingDate||"");
  const[sCouple,setSCouple]=useState(wData.coupleName||"");
  const[sGP,setSGP]=useState("");
  const impRef=useRef();

  const total=cats.reduce((a,c)=>a+c.items.length,0);
  const done=cats.reduce((a,c)=>a+c.items.filter(i=>i.done).length,0);
  const pct=total>0?Math.round(done/total*100):0;

  function updCats(newCats){writeDb("categories",newCats);}
  function toggleItem(cid,iid){
    const nc=cats.map(c=>c.id!==cid?c:{...c,items:c.items.map(i=>i.id!==iid?i:{...i,done:!i.done})});
    updCats(nc);
  }
  function addItem(cid){
    if(!newTxt.trim())return;
    const nc=cats.map(c=>c.id!==cid?c:{...c,items:[...c.items,{id:`${cid}-${Date.now()}`,text:newTxt.trim(),done:false,dueDate:newDue,vendor:""}]});
    updCats(nc);setNewTxt("");setNewDue("");setAddTo(null);
  }
  function delItem(cid,iid){updCats(cats.map(c=>c.id!==cid?c:{...c,items:c.items.filter(i=>i.id!==iid)}));}
  function saveEI(cid,iid){
    if(isP){
      updCats(cats.map(c=>c.id!==cid?c:{...c,items:c.items.map(i=>i.id!==iid?i:{...i,text:eTxt,dueDate:eDue,vendor:eVendor})}));
    } else {
      updCats(cats.map(c=>c.id!==cid?c:{...c,items:c.items.map(i=>i.id!==iid?i:{...i,vendor:eVendor})}));
    }
    setEditItem(null);
  }
  function saveCT(cid){updCats(cats.map(c=>c.id!==cid?c:{...c,title:eCatT}));setEditCat(null);}
  function addCat(){
    const id="cat-"+Date.now();
    const cols=["#C9A96E","#B5838D","#9DB4C0","#A8C5A0","#ADA7C9","#DDB892"];
    const nc={id,icon:"📌",title:"หมวดหมู่ใหม่",color:cols[cats.length%cols.length],items:[]};
    updCats([...cats,nc]);setTab("all");
  }
  function delCat(cid){if(!window.confirm("ลบหมวดหมู่นี้?"))return;updCats(cats.filter(c=>c.id!==cid));}

  const vis=tab==="all"?cats:tab==="pending"?cats.map(c=>({...c,items:c.items.filter(i=>!i.done)})).filter(c=>c.items.length>0):cats.map(c=>({...c,items:c.items.filter(i=>i.done)})).filter(c=>c.items.length>0);
  const inp={padding:"8px 10px",border:"1.5px solid #e0d4c8",borderRadius:8,fontSize:13,outline:"none",color:"#4a3728",background:"#fdf8f3",width:"100%",boxSizing:"border-box"};
  const smB={padding:"8px",border:"none",borderRadius:8,background:"#4a3728",color:"#fff",fontSize:13,cursor:"pointer",fontWeight:600};
  const smG={padding:"8px",border:"1.5px solid #e0d4c8",borderRadius:8,background:"transparent",color:"#9a8070",fontSize:13,cursor:"pointer"};

  return(
    <div style={{minHeight:"100vh",background:"#fdf8f3",paddingBottom:48}}>
      {/* STATUS BAR */}
      <div style={{background:online?"#4a3728":"#c0392b",padding:"4px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{color:"rgba(255,255,255,.7)",fontSize:11}}>
          {online?(syncing?"⏳ กำลัง sync...":"🟢 Realtime sync"):"🔴 ออฟไลน์"}
        </span>
        <span style={{color:"#C9A96E",fontSize:11,fontWeight:600,letterSpacing:1}}>ID: {weddingId}</span>
      </div>

      {/* HEADER */}
      <header style={{background:"linear-gradient(135deg,#4a3728 0%,#6b4c38 100%)",padding:"20px 20px 18px"}}>
        <div style={{maxWidth:480,margin:"0 auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
            <div>
              <p style={{color:"#C9A96E",fontSize:10,letterSpacing:3,margin:"0 0 3px"}}>✦ WANG WALAYA WEDDING PLANNER ✦</p>
              <h1 style={{color:"#fff",fontSize:22,fontWeight:300,letterSpacing:2,margin:0,fontStyle:"italic"}}>{wData.coupleName||"งานแต่งงาน"}</h1>
              <p style={{color:"rgba(255,255,255,.4)",fontSize:11,margin:"2px 0 0"}}>📞 095-425-2999</p>
            </div>
            <div style={{display:"flex",gap:6}}>
              {isP&&<button onClick={()=>setShowSet(true)} style={{background:"rgba(255,255,255,.15)",border:"none",borderRadius:8,padding:"6px 9px",fontSize:15,cursor:"pointer",color:"#fff"}}>⚙️</button>}

        </div>
      </header>

      {/* TABS */}

              {isP&&(addTo===cat.id?(
                <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:7}}>
                  <input placeholder="ชื่อรายการใหม่..." value={newTxt} onChange={e=>setNewTxt(e.target.value)}
                    onKeyDown={e=>e.key==="Enter"&&addItem(cat.id)} style={inp} autoFocus/>
                  <input type="date" value={newDue} onChange={e=>setNewDue(e.target.value)} style={inp}/>
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={()=>addItem(cat.id)} style={{...smB,background:cat.color,flex:1}}>เพิ่ม</button>
                    <button onClick={()=>{setAddTo(null);setNewTxt("");setNewDue("");}} style={{...smG,flex:1}}>ยกเลิก</button>
                  </div>
                </div>
              ):(
                <button onClick={()=>setAddTo(cat.id)} style={{marginTop:8,width:"100%",padding:7,border:"1.5px dashed #e0d4c8",borderRadius:10,background:"transparent",color:"#b8a898",fontSize:13,cursor:"pointer"}}>+ เพิ่มรายการ</button>
              ))}
            </section>
          );
        })}
      </main>

      {/* SETTINGS MODAL */}
      {showSet&&(
        <div style={{position:"fixed",inset:0,background:"rgba(74,55,40,.65)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:20}}
          onClick={e=>e.target===e.currentTarget&&setShowSet(false)}>
          <div style={{background:"#fff",borderRadius:20,padding:"24px 20px",maxWidth:340,width:"100%"}}>
            <h2 style={{fontSize:17,fontWeight:700,color:"#3a2b1f",marginBottom:14}}>⚙️ ตั้งค่างาน</h2>
            <div style={{background:"#f0e8df",borderRadius:10,padding:"10px 12px",marginBottom:14}}>
              <p style={{fontSize:11,color:"#9a8070",marginBottom:2}}>Wedding ID</p>
              <p style={{fontSize:20,fontWeight:700,color:"#4a3728",letterSpacing:3}}>{weddingId}</p>
            </div>
            {[["ชื่อคู่บ่าวสาว",sCouple,setSCouple,"text"],["วันแต่งงาน",sWDate,setSWDate,"date"]].map(([lb,v,sv,tp],i)=>(
              <div key={i} style={{marginBottom:10}}>
                <label style={{fontSize:12,color:"#9a8070",display:"block",marginBottom:3,fontWeight:600}}>{lb}</label>
                <input type={tp} value={v} onChange={e=>sv(e.target.value)} style={{...inp}}/>
              </div>
            ))}
            <div style={{marginBottom:14}}>
              <label style={{fontSize:12,color:"#9a8070",display:"block",marginBottom:3,fontWeight:600}}>PIN บ่าวสาว/แขก (เปลี่ยน)</label>
              <input type="password" placeholder="ใส่ PIN ใหม่ (เว้นว่างถ้าไม่เปลี่ยน)" value={sGP} onChange={e=>setSGP(e.target.value)} style={{...inp}}/>
            </div>
            <button style={{...S.btnPrimary,marginBottom:8}} onClick={()=>{
              writeDb("coupleName",sCouple);
              writeDb("weddingDate",sWDate);
              if(sGP.length>=4) writeDb("guestPin",sGP);
              setShowSet(false);
            }}>บันทึก</button>
            <button style={S.btnGhost} onClick={()=>setShowSet(false)}>ปิด</button>
          </div>
        </div>
      )}
    </div>
  );
}

const S={
  input:{padding:"11px 14px",border:"1.5px solid #e0d4c8",borderRadius:10,fontSize:14,outline:"none",color:"#4a3728",background:"#fdf8f3",width:"100%",boxSizing:"border-box",marginBottom:10},
  err:{color:"#e05252",fontSize:13,marginBottom:10,textAlign:"center"},
  btnPrimary:{width:"100%",padding:13,border:"none",borderRadius:99,background:"linear-gradient(135deg,#4a3728,#6b4c38)",color:"#fff",fontSize:15,cursor:"pointer",fontWeight:600,display:"block"},
  btnGhost:{width:"100%",padding:11,border:"1.5px solid #e0d4c8",borderRadius:99,background:"transparent",color:"#9a8070",fontSize:14,cursor:"pointer",display:"block"},
  backBtn:{background:"none",border:"none",color:"#9a8070",fontSize:14,cursor:"pointer",marginBottom:16,padding:0},
};

function DashboardScreen({weddings,onLoad,onBack,onOpen,dashPin,setDashPin,dashErr,setDashErr,dashAuth,setDashAuth}){
  const MASTER_PIN="wangwalaya2025";
  const[loading,setLoading]=useState(false);
  const[dashTab,setDashTab]=useState("active"); // active | archived
  async function doLoad(){setLoading(true);try{await onLoad();}catch(e){}finally{setLoading(false);}}
  useEffect(()=>{if(dashAuth){doLoad();}},[dashAuth]);

  function tryAuth(){
    if(dashPin===MASTER_PIN){setDashAuth(true);setDashErr("");}
    else setDashErr("PIN ไม่ถูกต้อง");
  }
  function fmtD(iso){if(!iso)return"-";const d=new Date(iso);return d.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"});}
  function copyText(t){navigator.clipboard?.writeText(t).catch(()=>{});}

  async function archiveWedding(id){
    await db.ref("weddings/"+id+"/archived").set(true);
    doLoad();
  }
  async function unarchiveWedding(id){
    await db.ref("weddings/"+id+"/archived").set(false);
    doLoad();
  }
  async function deleteWedding(id){
    if(!window.confirm("ลบงานนี้ถาวรหรือไม่? ไม่สามารถกู้คืนได้"))return;
    await db.ref("weddings/"+id).remove();
    doLoad();
  }

  const activeWeddings=weddings.filter(w=>!w.archived);
  const archivedWeddings=weddings.filter(w=>w.archived);
  const displayList=dashTab==="active"?activeWeddings:archivedWeddings;

  if(!dashAuth) return(
    <div style={{minHeight:"100vh",background:"#fdf8f3",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{width:"100%",maxWidth:320,textAlign:"center"}}>
        <button onClick={onBack} style={{background:"none",border:"none",color:"#9a8070",fontSize:14,cursor:"pointer",marginBottom:20,display:"block"}}>← กลับ</button>
        <p style={{fontSize:40,marginBottom:8}}>👑</p>
        <h2 style={{fontSize:20,color:"#4a3728",fontWeight:700,marginBottom:4}}>Planner Dashboard</h2>
        <p style={{fontSize:13,color:"#9a8070",marginBottom:20}}>ใส่ Master PIN เพื่อเข้าถึง</p>
        <input type="password" placeholder="Master PIN" value={dashPin} onChange={e=>setDashPin(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&tryAuth()}
          style={{width:"100%",padding:"12px 14px",border:"1.5px solid #e0d4c8",borderRadius:10,fontSize:18,textAlign:"center",letterSpacing:6,outline:"none",color:"#4a3728",background:"#fdf8f3",marginBottom:10,boxSizing:"border-box"}}/>
        {dashErr&&<p style={{color:"#e05252",fontSize:13,marginBottom:10}}>{dashErr}</p>}
        <button onClick={tryAuth} style={{width:"100%",padding:13,border:"none",borderRadius:99,background:"linear-gradient(135deg,#4a3728,#6b4c38)",color:"#fff",fontSize:15,cursor:"pointer",fontWeight:600}}>เข้าสู่ Dashboard</button>
      </div>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:"#fdf8f3",paddingBottom:48}}>
      <header style={{background:"linear-gradient(135deg,#4a3728,#6b4c38)",padding:"24px 20px 20px"}}>
        <div style={{maxWidth:480,margin:"0 auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <div>
              <p style={{color:"#C9A96E",fontSize:10,letterSpacing:3,margin:"0 0 3px"}}>✦ WANG WALAYA ✦</p>
              <h1 style={{color:"#fff",fontSize:20,fontWeight:300,letterSpacing:2,margin:0,fontStyle:"italic"}}>Planner Dashboard</h1>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button onClick={doLoad} style={{background:"rgba(201,169,110,.3)",border:"none",borderRadius:8,padding:"6px 12px",fontSize:13,cursor:"pointer",color:"#C9A96E"}}>{loading?"⏳":"🔄"}</button>
              <button onClick={onBack} style={{background:"rgba(255,255,255,.15)",border:"none",borderRadius:8,padding:"6px 12px",fontSize:13,cursor:"pointer",color:"#fff"}}>← ออก</button>
            </div>
          </div>
          <p style={{color:"rgba(255,255,255,.5)",fontSize:12,margin:"8px 0 0"}}>กำลังดำเนินการ {activeWeddings.length} งาน · จบแล้ว {archivedWeddings.length} งาน</p>
        </div>
      </header>

      {/* TABS */}
      <div style={{display:"flex",padding:"10px 16px",gap:8,maxWidth:480,margin:"0 auto"}}>
        <button onClick={()=>setDashTab("active")}
          style={{flex:1,padding:"8px",border:"1.5px solid"+(dashTab==="active"?" #4a3728":" #e8ddd4"),borderRadius:99,background:dashTab==="active"?"#4a3728":"transparent",color:dashTab==="active"?"#fff":"#9a8070",fontSize:13,cursor:"pointer",fontWeight:dashTab==="active"?600:400}}>
          💼 กำลังดำเนินการ ({activeWeddings.length})
        </button>
        <button onClick={()=>setDashTab("archived")}
          style={{flex:1,padding:"8px",border:"1.5px solid"+(dashTab==="archived"?" #4a3728":" #e8ddd4"),borderRadius:99,background:dashTab==="archived"?"#4a3728":"transparent",color:dashTab==="archived"?"#fff":"#9a8070",fontSize:13,cursor:"pointer",fontWeight:dashTab==="archived"?600:400}}>
          📦 จบแล้ว ({archivedWeddings.length})
        </button>
      </div>

      <main style={{maxWidth:480,margin:"0 auto",padding:"0 16px"}}>
        {displayList.length===0&&(
          <div style={{textAlign:"center",padding:40,color:"#9a8070"}}>
            {loading?"⏳ กำลังโหลด...":dashTab==="active"?"ไม่มีงานที่กำลังดำเนินการ":"ไม่มีงานที่จบแล้ว"}
            {!loading&&weddings.length===0&&<div style={{marginTop:12,fontSize:12,background:"#fff",borderRadius:10,padding:12,textAlign:"left"}}>
              <p style={{color:"#e05252",fontWeight:600,marginBottom:6}}>⚠️ โหลดข้อมูลไม่สำเร็จ</p>
              <p style={{color:"#9a8070",lineHeight:1.8}}>กรุณากด 🔄 อีกครั้ง<br/>หรือ reload หน้าเว็บแล้วเข้า Dashboard ใหม่</p>
            </div>}
          </div>
        )}
        {displayList.map(w=>{
          const total=(w.categories||[]).reduce((a,c)=>a+c.items.length,0);
          const done=(w.categories||[]).reduce((a,c)=>a+c.items.filter(i=>i.done).length,0);
          const pct=total>0?Math.round(done/total*100):0;
          const cd=countdown(w.weddingDate);
          return(
            <div key={w.id} style={{background:"#fff",borderRadius:16,padding:16,marginBottom:12,boxShadow:"0 2px 12px rgba(74,55,40,.07)",border:"1px solid"+(w.archived?"#e8ddd4":"#f0e8df"),opacity:w.archived?.85:1}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                    <h3 style={{fontSize:16,fontWeight:700,color:"#3a2b1f",margin:0}}>{w.coupleName||"ไม่ระบุชื่อ"}</h3>
                    {w.archived&&<span style={{fontSize:10,background:"#f0e8df",color:"#9a8070",padding:"2px 8px",borderRadius:99,fontWeight:600}}>จบแล้ว</span>}
                  </div>
                  <p style={{fontSize:12,color:"#9a8070",margin:0}}>📅 {fmtD(w.weddingDate)} {cd&&<span style={{color:"#C9A96E",fontWeight:600}}>· {cd}</span>}</p>
                </div>
                <span style={{fontSize:13,fontWeight:700,color:pct===100?"#7B9E87":"#C9A96E",background:pct===100?"rgba(123,158,135,.1)":"rgba(201,169,110,.1)",padding:"3px 10px",borderRadius:99,flexShrink:0,marginLeft:8}}>{pct}%</span>
              </div>
              <div style={{height:4,background:"#f0e8df",borderRadius:99,overflow:"hidden",marginBottom:12}}>
                <div style={{height:"100%",background:w.archived?"#c5bdb5":"linear-gradient(90deg,#C9A96E,#e8c98a)",width:`${pct}%`,borderRadius:99}}/>
              </div>
              <div style={{background:"#fdf8f3",borderRadius:10,padding:"10px 12px",marginBottom:10,fontSize:12}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <span style={{color:"#9a8070"}}>Wedding ID</span>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{color:"#4a3728",fontWeight:700,letterSpacing:2}}>{w.id}</span>
                    <button onClick={()=>copyText(w.id)} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,opacity:.6}}>📋</button>
                  </div>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <span style={{color:"#9a8070"}}>PIN Planner</span>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{color:"#4a3728",fontWeight:600}}>{w.plannerPin}</span>
                    <button onClick={()=>copyText(w.plannerPin)} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,opacity:.6}}>📋</button>
                  </div>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{color:"#9a8070"}}>PIN บ่าวสาว/แขก</span>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{color:"#4a3728",fontWeight:600}}>{w.guestPin}</span>
                    <button onClick={()=>copyText(w.guestPin)} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,opacity:.6}}>📋</button>
                  </div>
                </div>
              </div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {!w.archived&&<button onClick={()=>onOpen(w)} style={{flex:1,padding:"9px",border:"none",borderRadius:10,background:"#4a3728",color:"#fff",fontSize:13,cursor:"pointer",fontWeight:600,minWidth:100}}>เข้าจัดการงาน →</button>}
                {!w.archived&&<button onClick={()=>copyText(`Wedding ID: ${w.id}
PIN บ่าวสาว: ${w.guestPin}
ลิงก์: https://chic-donut-bec3eb.netlify.app`)} style={{padding:"9px 12px",border:"1.5px solid #e0d4c8",borderRadius:10,background:"transparent",color:"#9a8070",fontSize:13,cursor:"pointer"}}>📤</button>}
                {!w.archived
                  ?<button onClick={()=>archiveWedding(w.id)} style={{padding:"9px 12px",border:"1.5px solid #e0d4c8",borderRadius:10,background:"transparent",color:"#9a8070",fontSize:13,cursor:"pointer"}} title="เก็บเข้า Archive">📦 จบงาน</button>
                  :<button onClick={()=>unarchiveWedding(w.id)} style={{flex:1,padding:"9px",border:"1.5px solid #e0d4c8",borderRadius:10,background:"transparent",color:"#9a8070",fontSize:13,cursor:"pointer"}}>↩️ คืนสถานะ</button>
                }
                <button onClick={()=>deleteWedding(w.id)} style={{padding:"9px 12px",border:"1.5px solid #ffd0d0",borderRadius:10,background:"transparent",color:"#e05252",fontSize:13,cursor:"pointer"}} title="ลบถาวร">🗑️</button>
              </div>
            </div>
          );
        })}
      </main>
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
